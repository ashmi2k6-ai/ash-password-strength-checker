<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and friendly password strength checker that scores your password and gives actionable suggestions to make it stronger.">
    <title>Password Strength Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <div class="card">
            <!-- Header -->
            <div class="header">
                <div class="icon-wrap">
                    <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4" class="shield-check"/>
                    </svg>
                </div>
                <h1>Password Strength Checker</h1>
                <p class="subtitle">Enter your password below and we'll tell you how strong it is</p>
            </div>

            <!-- Password Input -->
            <div class="input-group">
                <label for="passwordInput">Your Password</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Type your password here..."
                        autocomplete="off"
                    >
                    <button id="toggleVisibility" class="toggle-btn" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="eyeOffIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <button id="checkBtn" class="check-btn">
                    <span>Check Strength</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>

            <!-- Results Section (hidden by default) -->
            <div id="resultsSection" class="results-section hidden">
                <!-- Score Display -->
                <div class="score-area">
                    <div class="score-ring-container">
                        <svg class="score-ring" viewBox="0 0 120 120">
                            <circle class="ring-bg" cx="60" cy="60" r="52" />
                            <circle id="scoreArc" class="ring-fill" cx="60" cy="60" r="52" />
                        </svg>
                        <div class="score-value">
                            <span id="scoreNumber">0</span>
                            <span class="score-total">/ 10</span>
                        </div>
                    </div>
                    <p id="strengthLabel" class="strength-label">—</p>
                </div>

                <!-- Criteria Checklist -->
                <div class="criteria-section">
                    <h2>How to improve</h2>
                    <ul id="criteriaList" class="criteria-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Your password is never stored or transmitted anywhere. Everything runs locally in your browser.</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
